experiences:

  - role: Senior Algorithm Engineer
    time: 2026.1 - Present
    company: Tencent
    details: |
      * Lead an algorithm team of ~15 people on frontier game-AI R&D, spanning: LLM-based game-generation evaluation systems and high-quality game-data synthesis; training a point-cloud foundation model for scene generation; exploring novel AI game generation with video models; and core algorithms for online AI game generation such as asset retrieval and 2D/3D asset processing.

  - role: LLM Algorithm Engineer
    time: 2023.7 - Present
    company: Tencent
    details: |
      * Optimized Qwen with SFT/ORPO/RLHF for 3D scene generation.
      * Built LLM-driven high-quality NPCs for AAA games, with human-like dialogue, actions, and expressions/emotions.

  - role: RL Algorithm Engineer
    time: 2022.7 - 2023.7
    company: Tencent
    details: |
      * Developed AI bots with reinforcement learning and imitation learning, successfully shipped to production and improved game retention.

  - role: RL Research Intern
    time: 2020.12 - 2021.4
    company: Netease Fuxi Lab
    details: |
      * Studied how game-content output affects player retention to guide numerical design.

  - role: RL Intern
    time: 2020.7-2020.9
    company: Parametrix.ai
    details: | 

  - role: Research Assistant 
    time: 2019.9-2020.6
    company: Chroma, CITI LAB, INSA-Lyon & INRIA
    details: |
      * Proposed belief occupancy state as a summary to recast Dec-POMDPs under one-sideness sharing to boMDP which is MDP actually.
      * Implemented belief occupancy state Heuristic search and value iteration algorithm to solve boMDP.
      * Applied linear programming and tabular method to improve the scalability.
      
  - role: Lead Developer
    time: 2018-2019
    company: Auto Test and Control Lab
    details: | 
      * Quantized floating point data of DL Networks into 16 or 8 bits on Caffe.
      * Applied KL Divergence to decrease the loss caused by quantization of 8 bits to just 1.5 for MobileNet-SSD.
      * Verified the Quantization Scheme for 16 bits on FPGA.

  - role: Developer
    time: 2018-2019
    company: Auto Test and Control Lab
    details: |
      * Designed and trained DL Network for diagnosis of pneumonia on Caffe and implemented it on Zynq. 
      * Won 2nd Place in the 16th Challenge Cup and Silver Award in the 9th Zuguang Cup.

  - role: Developer
    time: 2018-2018
    company: Wireless Charging Lab
    details: |
      * Manufactured and debugged control module for a wireless charging system.



